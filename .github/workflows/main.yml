name: Compile Action

on:
  push:
    branches:
      - main

env:
  TAG: "1.1"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      #- name: Get project version from pom.xml
      #  id: get-version
      #  uses: jactions/maven-version@v1

      - name: Get version and set environment variable
        shell: bash
        run: |
          PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_ENV

      - name: Use the version in a subsequent step
        #run: echo "The project version is ${{ steps.get-version.outputs.version }}"
        run: echo "The project version is ${{ env.PROJECT_VERSION }}"

      - name: Create Release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          #tag_name: 'v${{ env.TAG }}'
          #release_name: 'Release ${{ env.TAG }}'
          tag_name: 'v${{ env.PROJECT_VERSION }}'
          release_name: 'Release ${{ env.PROJECT_VERSION }}'
          draft: false
          prerelease: false

